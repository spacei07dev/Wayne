<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dairo Ibrahim · Portfolio Elevator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Share+Tech+Mono&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --walls:#c9ccd1; --brass:#c9a24a; --text:#1d1b19; --muted:#5b5650;
  --card:#ffffff; --cardtext:#1d1b19; --ease:cubic-bezier(.6,0,.3,1);
  --c-lobby:#f5ecd9; --c-1:#e3d9f5; --c-2:#d5f0e3; --c-3:#f8d5c9; --c-r:#1d2b5a;
}
html[data-theme=dark]{
  --walls:#2a2d33; --text:#f1ece4; --muted:#b5afa6; --card:#2a2c31; --cardtext:#f1ece4;
  --c-lobby:#1a1412; --c-1:#2a1a33; --c-2:#142a1e; --c-3:#2e1b17; --c-r:#0d1530;
}
*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:var(--text);background:var(--walls)}
h1,h2,h3,.digit,#fname,.btn{font-family:'Space Grotesk',Inter,sans-serif}
.building{height:100vh;display:grid;grid-template-columns:minmax(220px,1fr) minmax(380px,2fr) minmax(200px,.8fr);gap:clamp(12px,2vw,28px);padding:clamp(12px,2.5vh,28px) clamp(12px,2vw,28px);
  background-color:var(--walls);background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px)}

/* Mirror */
.mirror{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;min-height:0}
.frame{width:min(100%,300px);aspect-ratio:3/4;max-height:58vh;border-radius:999px 999px 16px 16px;padding:12px;background:linear-gradient(135deg,#f3d88a,#b8862b 45%,#e9c66b 60%,#8a5f1c);box-shadow:0 20px 40px rgba(0,0,0,.25)}
.glass{position:relative;width:100%;height:100%;border-radius:900px 900px 8px 8px;overflow:hidden;background:linear-gradient(160deg,#d8dde3,#7d8693)}
.glass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-120%);animation:shine 5s ease-in-out infinite}
@keyframes shine{0%,40%{transform:translateX(-120%)}100%{transform:translateX(120%)}}
.photo{width:100%;height:100%;display:grid;place-items:center;object-fit:cover;color:#fff;font:700 4rem 'Space Grotesk',sans-serif}
img.photo{object-fit:cover}
.mname{margin:0;font-size:1.4rem}
.roles{margin:0;color:var(--muted);font-size:.95rem}

/* Shaft and indicator */
.shaft{display:flex;flex-direction:column;min-height:0;position:relative}
.shaft.shake{animation:shake .12s infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(.5px,-.5px)}50%{transform:translate(-.5px,.5px)}75%{transform:translate(.5px,.5px)}100%{transform:none}}
.indicator{display:flex;align-items:center;gap:18px;background:#0b0b0b;border:4px solid var(--brass);border-radius:10px;padding:10px 18px;box-shadow:inset 0 0 20px #000}
.arrows{display:flex;flex-direction:column;gap:2px}
.arrows span{font-size:20px;color:#3a2a10;transition:color .2s}
.arrows .on{color:#ffb347;text-shadow:0 0 10px #ff9500}
.digit{font-family:'Share Tech Mono',monospace;font-size:clamp(44px,7vh,68px);line-height:1;min-width:1.2ch;text-align:center;color:#ffb347;text-shadow:0 0 8px #ff9500,0 0 22px #ff7a00}
#fname{flex:1;text-align:right;color:#ffb347;text-transform:uppercase;letter-spacing:.12em;font-size:.95rem}

/* Doorway and doors */
.doorway{position:relative;flex:1;min-height:0;margin-top:14px;border:10px solid #b9bec6;border-bottom:none;border-radius:14px 14px 0 0;background:var(--c-lobby);overflow:hidden;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.floor{position:absolute;inset:0;display:none;overflow-y:auto;padding:clamp(20px,4vh,44px);background:var(--bg)}
.floor.active{display:flex;flex-direction:column}
.floor[data-k=lobby]{--bg:var(--c-lobby)}
.floor[data-k="1"]{--bg:var(--c-1)}
.floor[data-k="2"]{--bg:var(--c-2)}
.floor[data-k="3"]{--bg:var(--c-3)}
.floor[data-k=rooftop]{--bg:var(--c-r);color:#fff;--text:#fff;--muted:#c5cbe0}
.door{position:absolute;top:0;bottom:0;width:50%;z-index:5;transition:transform 1s var(--ease);
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.05) 0 1px,transparent 1px 3px),linear-gradient(100deg,#e6e9ed,#b7bdc5 35%,#e9edf1 50%,#a9afb8 75%,#d7dce2)}
.door::before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 40%,rgba(255,255,255,.6) 50%,transparent 60%);pointer-events:none}
.door.l{left:0}.door.r{right:0}
.door.l::after,.door.r::after{content:"";position:absolute;top:0;bottom:0;width:6px;background:#111}
.door.l::after{right:0}.door.r::after{left:0}
.doorway.open .door.l{transform:translateX(-100%)}
.doorway.open .door.r{transform:translateX(100%)}
.sill{height:14px;margin:0 -10px;border-radius:0 0 4px 4px;background:repeating-linear-gradient(90deg,#8d939b 0 6px,#5f656d 6px 8px)}

/* Floor content */
h2{margin:0 0 6px;font-size:clamp(28px,4vw,42px)}
.intro{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.slot{animation:rise .6s var(--ease) both;animation-delay:calc(.5s + var(--i)*.15s)}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.card{background:var(--card);color:var(--cardtext);border-radius:18px;padding:14px;box-shadow:0 8px 20px rgba(0,0,0,.12);transition:transform .25s}
.card:hover{transform:translateY(-6px)}
.cover{height:130px;border-radius:12px;overflow:hidden;margin-bottom:12px}
.cv{width:100%;height:100%;transition:transform .5s}
.card:hover .cv{transform:scale(1.06)}
.card h3{margin:0 0 4px;font-size:1.1rem}
.card p{margin:0 0 10px;color:var(--muted);font-size:.92rem}
.tags span{display:inline-block;font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(127,127,127,.15);margin:0 6px 6px 0}
.banner{height:150px;border-radius:16px;margin-bottom:20px;display:grid;place-items:center;background:linear-gradient(135deg,#f6b393,#8b5cf6);color:#fff;font-weight:600}
.stat{font-family:'Space Grotesk';font-size:clamp(24px,3vw,34px);color:#c9a24a;margin:0 0 20px}
.cta{align-self:flex-start;margin-top:22px;padding:12px 20px;border-radius:999px;background:var(--text);color:var(--walls);text-decoration:none;font-weight:600}

/* Lobby */
.lobby{display:grid;grid-template-columns:1.2fr 1fr;gap:32px;align-items:center;margin:auto;width:100%}
.lobby h1{font-size:clamp(40px,6vw,86px);line-height:1.02;margin:0}
.gold{color:#c9a24a}
.dir{background:#111;color:#f1ece4;border:3px solid var(--brass);border-radius:12px;padding:20px}
.dir h2{font-size:1.4rem;color:#c9a24a;margin-bottom:10px}
.row{display:flex;gap:12px;width:100%;background:none;border:0;border-bottom:1px solid #333;color:inherit;padding:10px 4px;font:inherit;cursor:pointer;text-align:left}
.row:hover{background:#1c1c1c}
.row b{font-family:'Share Tech Mono',monospace;color:#ffb347;width:2ch}

/* Rooftop */
.roof{margin:auto 0;width:100%;position:relative;z-index:2;padding-bottom:90px}
.roof h2{font-size:clamp(36px,5vw,64px)}
.contact{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:1px solid rgba(255,255,255,.2);padding:14px 0}
.contact span{display:block;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.contact a{color:#fff}
.copy{padding:8px 14px;border-radius:999px;border:1px solid #fff;background:none;color:#fff;cursor:pointer;font:inherit}
.sky{position:absolute;left:0;bottom:0;width:100%;height:90px;z-index:1}
.floor[data-k=rooftop]::before{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20px 30px,#fff,transparent),radial-gradient(1.5px 1.5px at 120px 80px,#fff,transparent),radial-gradient(1px 1px at 200px 150px,#fff,transparent),radial-gradient(1.5px 1.5px at 300px 60px,#fff,transparent);background-size:340px 220px;opacity:.7;pointer-events:none}

/* Panel and buttons */
.panel{display:flex;flex-direction:column;justify-content:center;gap:22px;background:linear-gradient(#3a3d43,#1e2024);border:3px solid var(--brass);border-radius:16px;padding:22px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;justify-items:center}
.bw{display:flex;flex-direction:column;align-items:center;gap:6px}
.btn{width:62px;height:62px;border-radius:50%;border:none;cursor:pointer;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff,#c7ccd3 45%,#8e95a0);box-shadow:0 5px 0 #5d636c,0 8px 12px rgba(0,0,0,.35);font:600 20px 'Space Grotesk',sans-serif;color:#222;transition:transform .08s,box-shadow .15s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #5d636c}
.btn.active{box-shadow:0 0 0 4px #ffb347,0 0 18px #ff9500,0 5px 0 #5d636c}
.btn.sm{width:52px;height:52px;font-size:16px}
.lbl{font-size:11px;color:#cfcfcf;text-align:center;max-width:76px;line-height:1.2}
.controls{display:flex;justify-content:space-around;gap:10px;border-top:1px solid #444;padding-top:18px}
button:focus-visible,a:focus-visible,.row:focus-visible{outline:3px solid #7fb8ff;outline-offset:3px}

/* Theme switch */
.theme{position:fixed;top:14px;right:14px;z-index:50;display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid var(--brass);background:var(--card);color:var(--text);font:600 13px Inter,sans-serif;cursor:pointer}

/* Mobile */
@media (max-width:820px){
  body{height:auto;overflow:auto}
  .building{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto auto}
  .mirror{display:none}
  .shaft{height:72vh}
  .panel{flex-direction:column}
  .btns{grid-template-columns:repeat(5,1fr)}
  .btn{width:52px;height:52px;font-size:17px}
  .lbl{font-size:10px}
  .lobby{grid-template-columns:1fr}
  .theme{width:44px;height:44px;padding:0;justify-content:center;border-radius:50%}
  .theme .txt{display:none}
}

/* Reduced motion */
html.reduced *,html.reduced *::before,html.reduced *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
</style>
</head>
<body>

<!-- ====== EDIT YOUR CONTENT HERE (all text lives in the CONFIG block in the script) ====== -->

<main class="building" id="building">

  <aside class="mirror" aria-label="Owner profile">
    <div class="frame"><div class="glass" id="photoWrap"></div></div>
    <h2 class="mname" id="mname"></h2>
    <p class="roles" id="roles"></p>
  </aside>

  <section class="shaft" id="shaft" aria-label="Elevator">
    <div class="indicator" aria-live="polite">
      <div class="arrows"><span id="up" aria-hidden="true">▲</span><span id="down" aria-hidden="true">▼</span></div>
      <div class="digit" id="digit">G</div>
      <div id="fname">Lobby</div>
    </div>
    <div class="doorway" id="doorway">
      <div id="floors" style="display:contents"></div>
      <div class="door l"></div>
      <div class="door r"></div>
    </div>
    <div class="sill"></div>
  </section>

  <nav class="panel" aria-label="Elevator controls">
    <div class="btns" id="floorBtns"></div>
    <div class="controls">
      <div class="bw"><button class="btn sm" id="open" aria-label="Open doors">◂▸</button><span class="lbl">Open</span></div>
      <div class="bw"><button class="btn sm" id="close" aria-label="Close doors">▸◂</button><span class="lbl">Close</span></div>
      <div class="bw"><button class="btn sm" id="music" aria-pressed="false" aria-label="Toggle music">♪</button><span class="lbl">Music</span></div>
    </div>
  </nav>
</main>

<button class="theme" id="theme" aria-label="Switch light or dark mode"><span class="ico">☾</span><span class="txt">Dark mode</span></button>

<script>
/* ================= CONFIG: edit your details here ================= */
const OWNER = {
  name: "Dairo Ibrahim",
  initials: "DI",
  photo: "profile.jpg?v=2",                   // paste a data:image/... base64 string here to embed your photo
  roles: ["[Role 1]", "[Role 2]", "[Role 3]"],
  email: "[your@email.com]",
  ig: "[@yourhandle]",
  location: "[City, Country]"
};
const SECTIONS = {
  "1": { short: "UI/UX", name: "[Section 1]", intro: "[One short line.]", projects: [
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] },
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] },
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] } ] },
  "2": { short: "Web", name: "[Section 2]", intro: "[One short line.]", projects: [
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] },
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] },
    { t: "[Project name]", l: "[One short line]", tags: ["[Tag]", "[Tag]"] } ] },
  "3": { short: "Content", name: "[Section 3]", intro: "[One short line.]",
    banner: "[Photo of you creating content]", stat: "[150k+ impressions on one post]",
    cta: "Watch on Instagram " , projects: [
    { t: "[Content series]", l: "[One short line]", tags: ["[Tag]"] },
    { t: "[Content series]", l: "[One short line]", tags: ["[Tag]"] },
    { t: "[Content series]", l: "[One short line]", tags: ["[Tag]"] } ] }
};
const COVERS = [["#f3c6a5","#e77f67"],["#a8d8ea","#5b8def"],["#fde68a","#f59e0b"],["#d9f99d","#4d7c0f"],["#fbcfe8","#be185d"],["#c7d2fe","#4338ca"]];

/* ================= Floors (order = elevator order) ================= */
const FLOORS = [
  { k: "lobby",   btn: "G", name: "Lobby",    short: "Lobby",   hash: "lobby" },
  { k: "1",       btn: "1", name: SECTIONS["1"].name, short: SECTIONS["1"].short, hash: "floor-1" },
  { k: "2",       btn: "2", name: SECTIONS["2"].name, short: SECTIONS["2"].short, hash: "floor-2" },
  { k: "3",       btn: "3", name: SECTIONS["3"].name, short: SECTIONS["3"].short, hash: "floor-3" },
  { k: "rooftop", btn: "R", name: "Rooftop",  short: "Roof",    hash: "rooftop" }
];

/* ================= Render ================= */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function card(p, i, ci){
  const [a, b] = COVERS[ci % COVERS.length];
  return `<div class="slot" style="--i:${i}"><article class="card">
    <div class="cover"><div class="cv" style="background:linear-gradient(135deg,${a},${b})"></div></div>
    <h3>${p.t}</h3><p>${p.l}</p>
    <div class="tags">${p.tags.map(t => `<span>${t}</span>`).join("")}</div></article></div>`;
}
function sectionHTML(s){
  const igHandle = OWNER.ig.replace("@", "");
  return `<h2>${s.name}</h2><p class="intro">${s.intro}</p>
    ${s.banner ? `<div class="banner">${s.banner}</div>` : ""}
    ${s.stat ? `<p class="stat">${s.stat}</p>` : ""}
    <div class="grid">${s.projects.map((p, i) => card(p, i, i)).join("")}</div>
    ${s.cta ? `<a class="cta" href="https://instagram.com/${igHandle}" target="_blank" rel="noopener">${s.cta}${OWNER.ig}</a>` : ""}`;
}
function lobbyHTML(){
  return `<div class="lobby"><div><h1>Hi, I'm <span class="gold">${OWNER.name}</span>.</h1></div>
    <aside class="dir"><h2>Building Directory</h2>
    ${FLOORS.map((f, i) => `<button class="row" data-go="${i}"><b>${f.btn}</b>${f.name}</button>`).join("")}
    </aside></div>`;
}
function roofHTML(){
  return `<div class="roof"><h2>Let's build something.</h2>
    <p class="intro">Apps, websites and brand collabs.</p>
    <div class="contact"><div><span>Email</span>${OWNER.email}</div><button class="copy" data-copy>Copy</button></div>
    <div class="contact"><div><span>Instagram</span><a href="https://instagram.com/${OWNER.ig.replace("@", "")}" target="_blank" rel="noopener">${OWNER.ig}</a></div></div>
    <div class="contact"><div><span>Location</span>${OWNER.location}</div></div></div>
    <svg class="sky" viewBox="0 0 800 90" preserveAspectRatio="none" aria-hidden="true"><path fill="#0a0f22" d="M0 90V60h40V35h30v25h30V20h25v40h35V45h40V10h30v35h45V50h35V25h40v25h30V40h50V15h30v25h40V55h35v35z"/></svg>`;
}
function renderAll(){
  $("#floors").innerHTML = FLOORS.map((f, i) => {
    const body = f.k === "lobby" ? lobbyHTML() : f.k === "rooftop" ? roofHTML() : sectionHTML(SECTIONS[f.k]);
    return `<section class="floor" id="${f.hash}" data-k="${f.k}" data-i="${i}" aria-label="${f.name}">${body}</section>`;
  }).join("");
  $("#floorBtns").innerHTML = FLOORS.map((f, i) =>
    `<div class="bw"><button class="btn" data-i="${i}" aria-label="Go to ${f.name}">${f.btn}</button><span class="lbl">${f.short}</span></div>`).join("");
  $("#mname").textContent = OWNER.name;
  $("#roles").textContent = OWNER.roles.join(" · ");
  $("#photoWrap").innerHTML = OWNER.photo
    ? `<img class="photo" src="${OWNER.photo}" alt="Photo of ${OWNER.name}">`
    : `<div class="photo" role="img" aria-label="Photo placeholder">${OWNER.initials}</div>`;
}

/* ================= Sound (Web Audio, starts only after a click) ================= */
let ac = null, hum = null, mt = null, mstep = 0, musicOn = false;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reduce) document.documentElement.classList.add("reduced");
function audio(){
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === "suspended") ac.resume();
  return ac;
}
function tone(freq, dur, type = "sine", vol = .2, when = 0){
  const a = audio(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + when;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
function ding(){ tone(988, 1.4, "sine", .22); tone(1319, 1.8, "sine", .16, .18); }
function startHum(){
  if (reduce) return;
  const a = audio(), o = a.createOscillator(), f = a.createBiquadFilter(), g = a.createGain();
  o.type = "sawtooth"; o.frequency.value = 58; f.type = "lowpass"; f.frequency.value = 160;
  g.gain.setValueAtTime(0, a.currentTime); g.gain.linearRampToValueAtTime(.05, a.currentTime + .3);
  o.connect(f).connect(g).connect(a.destination); o.start();
  hum = () => { const t = a.currentTime; g.gain.setTargetAtTime(0, t, .08); o.stop(t + .5); };
}
function stopHum(){ if (hum) { hum(); hum = null; } }
const CH = [[261.6,329.6,392],[220,261.6,329.6],[174.6,220,261.6],[196,246.9,293.7]];
function music(on){
  musicOn = on;
  const b = $("#music");
  b.setAttribute("aria-pressed", on); b.classList.toggle("active", on);
  clearInterval(mt); mt = null;
  if (on) {
    audio();
    mt = setInterval(() => {
      const c = CH[Math.floor(mstep / 3) % 4];
      tone(c[mstep % 3] * 2, 2.2, "triangle", .04);
      mstep++;
    }, 700);
  }
}

/* ================= Elevator behaviour ================= */
let cur = 0, busy = false;
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 60) : ms));

function setDoors(open){ $("#doorway").classList.toggle("open", open); }
function setArrows(dir){ $("#up").classList.toggle("on", dir > 0); $("#down").classList.toggle("on", dir < 0); }
function showDigit(i){ $("#digit").textContent = FLOORS[i].btn; $("#fname").textContent = FLOORS[i].name; }
function showFloor(i){
  $$(".floor").forEach(f => {
    const on = +f.dataset.i === i;
    f.classList.toggle("active", on);
    if (on) f.scrollTop = 0;
  });
  $$(".btn[data-i]").forEach(b => b.classList.toggle("active", +b.dataset.i === i));
  showDigit(i);
}

async function ride(target){
  if (busy) return;
  if (target === cur) { setDoors(true); return; }
  busy = true;
  setDoors(false);
  await wait(1000);
  const dir = target > cur ? 1 : -1;
  setArrows(dir);
  if (!reduce) $("#shaft").classList.add("shake");
  startHum();
  while (cur !== target) {
    cur += dir;
    showDigit(cur);
    await wait(650);
  }
  stopHum();
  $("#shaft").classList.remove("shake");
  setArrows(0);
  ding();
  showFloor(cur);
  await wait(300);
  setDoors(true);
  busy = false;
  history.replaceState(null, "", "#" + FLOORS[cur].hash);
}

function copyEmail(b){
  navigator.clipboard.writeText(OWNER.email).then(
    () => b.textContent = "Copied ✓",
    () => b.textContent = "Copy failed"
  ).finally(() => setTimeout(() => b.textContent = "Copy", 1500));
}

/* ================= Events ================= */
document.body.addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.dataset.i !== undefined) ride(+b.dataset.i);
  else if (b.dataset.go !== undefined) ride(+b.dataset.go);
  else if (b.hasAttribute("data-copy")) copyEmail(b);
  else if (b.id === "open") setDoors(true);
  else if (b.id === "close") setDoors(false);
  else if (b.id === "music") music(!musicOn);
});

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const map = { g: 0, "1": 1, "2": 2, "3": 3, r: 4 };
  const m = map[e.key.toLowerCase()];
  if (m !== undefined) ride(m);
});

window.addEventListener("hashchange", () => {
  const idx = FLOORS.findIndex(f => "#" + f.hash === location.hash);
  if (idx > -1) ride(idx);
});

/* Theme: follow device setting until the visitor chooses */
function setTheme(t){
  document.documentElement.dataset.theme = t;
  $("#theme .txt").textContent = t === "dark" ? "Light mode" : "Dark mode";
  $("#theme .ico").textContent = t === "dark" ? "☀" : "☾";
  try { localStorage.setItem("theme", t); } catch (e) {}
}
$("#theme").addEventListener("click", () =>
  setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark"));

/* ================= Boot ================= */
renderAll();
let saved = null;
try { saved = localStorage.getItem("theme"); } catch (e) {}
setTheme(saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));

const startIdx = FLOORS.findIndex(f => "#" + f.hash === location.hash);
cur = startIdx > -1 ? startIdx : 0;
showFloor(cur);
setTimeout(() => setDoors(true), 600);   // doors start closed, then open on arrival
</script>
</body>
</html>
